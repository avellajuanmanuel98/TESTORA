services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testora
      POSTGRES_PASSWORD: testora
      POSTGRES_DB: testora
    ports:
      - "5432:5432"
    volumes:
      - testora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://testora:testora@db:5432/testora
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - testora_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  testora_postgres_data:
  testora_frontend_node_modules:
