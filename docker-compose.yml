services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assuria
      POSTGRES_PASSWORD: assuria
      POSTGRES_DB: assuria
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - assuria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assuria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://assuria:assuria@db:5432/assuria
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info --concurrency=1
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://assuria:assuria@db:5432/assuria
      REDIS_URL: redis://redis:6379/0
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      selenium:
        condition: service_started

  # Selenium talks Remote WebDriver from day one (see architecture notes) —
  # swapping this for a real Grid hub later is only a URL change.
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "${SELENIUM_PORT:-4444}:4444"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - assuria_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  assuria_postgres_data:
  assuria_frontend_node_modules:
